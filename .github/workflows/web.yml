name: Web checks

on:
  push:
    paths: ['server/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: weave_test
          MYSQL_USER: weave_test
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:8.0
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: '${{ matrix.database }}'
      DB_DATABASE: '${{ matrix.database == ''mysql'' && ''weave_test'' || '':memory:'' }}'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: weave_test
      DB_PASSWORD: test-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      ASSET_DISK: local
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      XDEBUG_MODE: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, mbstring, pdo_mysql, pdo_sqlite, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: php vendor/bin/pint --test
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:frontend
      - run: npm run test:render
      - run: npm run format:check
      - run: npm run build
      - run: php artisan app:check-services
      - run: php artisan test

  browser:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: server/test-results/
          retention-days: 7
